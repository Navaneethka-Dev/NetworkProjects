<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Monitoring Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        .container {
            text-align: center;
            padding: 40px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 50px;
            flex-wrap: wrap;
        }

        .feature {
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 15px;
            width: 200px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .feature-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        .feature h3 {
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        .feature p {
            font-size: 0.9rem;
            margin: 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🌐 Network Monitor</h1>
        <p>Real-time network infrastructure monitoring dashboard</p>
        <a href="/dashboard/" class="btn">Open Dashboard</a>

        <div class="features">
            <div class="feature">
                <div class="feature-icon">📊</div>
                <h3>Real-time Stats</h3>
                <p>Live traffic metrics and device status</p>
            </div>
            <div class="feature">
                <div class="feature-icon">🔔</div>
                <h3>Smart Alerts</h3>
                <p>Instant notifications on issues</p>
            </div>
            <div class="feature">
                <div class="feature-icon">📈</div>
                <h3>Analytics</h3>
                <p>Historical data visualization</p>
            </div>
            <div class="feature">
                <div class="feature-icon">🛡️</div>
                <h3>SNMP Support</h3>
                <p>Multi-vendor monitoring</p>
            </div>
        </div>
    </div>
</body>

</html>
