# ─────────────────────────────────────────────────────────────────────────────
# Example deployment variables file
# Used with: python main.py deploy --device router1 --template <template> --vars configs/vars_example.yaml
# ─────────────────────────────────────────────────────────────────────────────

# ── Base / security settings ──────────────────────────────────────────────────
domain_name: network.local
enable_secret: "Str0ngS3cr3t!"

# ── NTP & logging ─────────────────────────────────────────────────────────────
ntp_server: 10.0.0.1
logging_server: 10.0.0.2

# ── SNMP ──────────────────────────────────────────────────────────────────────
snmp_community: N3tAut0m4t3

# ── VLAN configuration (used by templates/vlan_config.j2) ─────────────────────
vlans:
  - id: 10
    name: MANAGEMENT
    ip: 192.168.10.1
    mask: 255.255.255.0
  - id: 20
    name: SERVERS
    ip: 192.168.20.1
    mask: 255.255.255.0
  - id: 30
    name: USERS
    ip: 192.168.30.1
    mask: 255.255.255.0
  - id: 99
    name: NATIVE
    ip: 192.168.99.1
    mask: 255.255.255.0

# ── ACL configuration (used by templates/acl_config.j2) ──────────────────────
acl_name: MGMT_ACCESS
acl_entries:
  - sequence: 10
    action: permit
    source: 10.0.0.0
    wildcard: 0.0.255.255
    remark: "Corporate network"
  - sequence: 20
    action: permit
    source: 192.168.10.0
    wildcard: 0.0.0.255
    remark: "Management VLAN"
  - sequence: 90
    action: deny
    source: any
    wildcard: ""
    remark: "Deny all others"

# ── BGP configuration (used by templates/bgp_config.j2) ─────────────────────
local_as: 65001
router_id: 10.0.0.1

bgp_neighbors:
  - ip: 10.0.0.2
    remote_as: 65002
    description: "Transit-Provider-A"
    password: "bgpS3cr3t!"
    soft_reconfig: true
    prefix_list_in: FROM_PROVIDER_A
    prefix_list_out: TO_PROVIDER_A
  - ip: 10.0.0.3
    remote_as: 65003
    description: "Peer-B"
    soft_reconfig: true

networks:
  - prefix: 203.0.113.0
    mask: 255.255.255.0
