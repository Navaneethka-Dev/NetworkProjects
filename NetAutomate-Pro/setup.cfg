[metadata]
name = netautomate-pro
version = 1.0.0
description = Production-grade network automation CLI for Cisco and Juniper devices
long_description = file: README.md
long_description_content_type = text/markdown
author = Navaneethraj KA
author_email = nvnthrj@gmail.com
url = https://github.com/Navaneethka-Dev/NetAutomate-Pro
license = MIT
keywords = network automation, cisco, juniper, netmiko, napalm, cli
classifiers =
    Development Status :: 5 - Production/Stable
    Environment :: Console
    Intended Audience :: System Administrators
    Intended Audience :: Telecommunications Industry
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Topic :: System :: Networking
    Topic :: System :: Systems Administration

[options]
packages = find:
python_requires = >=3.8
install_requires =
    netmiko>=4.1.0
    paramiko>=3.0.0
    pyyaml>=6.0
    jinja2>=3.1.0
    colorama>=0.4.6
    python-dotenv>=1.0.0
    rich>=13.0.0
    click>=8.1.0
    schedule>=1.2.0

[options.extras_require]
napalm =
    napalm>=4.1.0
test =
    pytest>=7.0
    pytest-cov>=4.0
    pytest-mock>=3.10
dev =
    black
    flake8
    mypy
    pre-commit

[options.entry_points]
console_scripts =
    netautomate = main:cli

[options.package_data]
netautomate = py.typed

[flake8]
max-line-length = 100
exclude = .git,__pycache__,venv,.venv,build,dist

[mypy]
python_version = 3.8
warn_return_any = True
warn_unused_configs = True
